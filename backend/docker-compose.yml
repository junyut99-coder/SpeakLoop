services:
  mysql:
    image: mysql:8.4
    container_name: speakloop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: speakloop
      MYSQL_USER: speakloop
      MYSQL_PASSWORD: speakloop_local
      MYSQL_ROOT_PASSWORD: local_root_only_change_me
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - speakloop_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uspeakloop -pspeakloop_local --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  speakloop_mysql_data:
